name: Validate Learn Kubernetes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate curriculum and JavaScript
        run: npm run validate

      - name: Build static site
        run: npm run build

      - name: Compile backend and validate exam catalogues
        run: |
          python3 -m py_compile backend/app.py backend/exam_catalog.py backend/validate_catalog.py
          PYTHONPATH=backend python3 backend/validate_catalog.py

      - name: Install CloudFormation linter
        run: python3 -m pip install --quiet cfn-lint

      - name: Validate CloudFormation
        run: cfn-lint infra/cloudformation/main.yml
